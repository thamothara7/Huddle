<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 64 64" role="img" aria-label="Huddle">
  <defs>
    <linearGradient id="huddle-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="huddle-pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#huddle-bg)"/>

  <!-- Stacked queue pills (3 reports clustered) with fading opacity to suggest depth -->
  <rect x="13" y="14" width="38" height="9" rx="4.5" fill="url(#huddle-pill)" opacity="0.98"/>
  <rect x="13" y="27.5" width="38" height="9" rx="4.5" fill="white" opacity="0.62"/>
  <rect x="13" y="41" width="38" height="9" rx="4.5" fill="white" opacity="0.34"/>

  <!-- Active indicator on the topmost pill: small orange dot = "this one has context" -->
  <circle cx="20" cy="18.5" r="2.5" fill="#fb923c"/>
</svg>
